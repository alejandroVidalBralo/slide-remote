<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mando de diapositivas</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #eef0f3;
    --text: #1a1d23;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --border: #e5e7eb;
    --danger: #dc2626;
    --ok: #16a34a;
    color-scheme: light dark;
    padding-top: env(safe-area-inset-top, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101317;
      --surface: #1a1f26;
      --surface-2: #21272f;
      --text: #f2f3f5;
      --muted: #9aa3af;
      --accent: #3b82f6;
      --accent-text: #ffffff;
      --border: #2a3038;
      --danger: #f87171;
      --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
    min-height: 100vh;
  }
  .app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 6px;
  }
  .app-name {
    font-size: 1rem;
    font-weight: 700;
  }
  .status-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--danger);
    flex-shrink: 0;
  }
  .dot.connected { background: var(--ok); }
  .dot.connecting { background: #f59e0b; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .connect-btn {
    display: block;
    width: calc(100% - 32px);
    margin: 4px 16px 8px;
    padding: 15px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 14px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
  }
  .connect-btn:active { opacity: 0.8; }
  .connect-btn.hidden { display: none; }

  .content {
    flex: 1;
    padding: 4px 16px calc(96px + env(safe-area-inset-bottom, 0px));
    opacity: 0.4;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .content.enabled { opacity: 1; pointer-events: auto; }

  .panel { display: flex; flex-direction: column; gap: 14px; max-width: 420px; margin: 0 auto; }
  .panel[hidden] { display: none; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
  }
  .card-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 10px;
    font-weight: 600;
  }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .big-btn {
    aspect-ratio: 1 / 0.75;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 18px;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 0.95rem;
    font-weight: 600;
  }
  .big-btn:active { background: var(--accent); color: var(--accent-text); }
  .big-btn svg { width: 32px; height: 32px; }

  .btn {
    padding: 14px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 14px;
    font-size: 0.88rem;
    font-weight: 600;
  }
  .btn:active { background: var(--accent); color: var(--accent-text); }
  .btn.wide { width: 100%; }
  .btn.subtle { color: var(--muted); font-weight: 500; }

  .segmented {
    display: flex;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 3px;
    gap: 3px;
  }
  .segmented button {
    flex: 1;
    padding: 9px 6px;
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 10px;
    font-size: 0.82rem;
    font-weight: 600;
  }
  .segmented button.active { background: var(--accent); color: var(--accent-text); }

  .goto-row { display: flex; gap: 10px; }
  .goto-row input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
  }
  .goto-row button { flex: 0 0 auto; padding: 12px 18px; }

  .touch-pad {
    width: 100%;
    aspect-ratio: 16 / 10;
    border: 2px dashed var(--border);
    border-radius: 18px;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
    gap: 6px;
    padding: 16px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .touch-pad svg { width: 28px; height: 28px; opacity: 0.6; }

  .kb-input {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 1rem;
  }
  .kb-input::placeholder { color: var(--muted); }

  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grid4 .btn { padding: 12px 4px; font-size: 0.78rem; }
  .grid4 .btn svg { width: 18px; height: 18px; }

  #log {
    font-size: 0.72rem;
    color: var(--muted);
    text-align: center;
    min-height: 1.1em;
  }
  .unsupported {
    max-width: 360px;
    margin: 40px auto;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    opacity: 0.4;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .bottom-nav.enabled { opacity: 1; pointer-events: auto; }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 8px 4px;
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 12px;
    font-size: 0.72rem;
    font-weight: 600;
  }
  .nav-btn svg { width: 22px; height: 22px; }
  .nav-btn.active { color: var(--accent); }
</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <span class="app-name">Mando remoto</span>
      <div class="status-pill">
        <span class="dot" id="dot"></span>
        <span id="statusText">Desconectado</span>
      </div>
    </header>

    <button id="connectBtn" class="connect-btn">Conectar</button>

    <main class="content" id="content">
      <section class="panel" id="panelMando">
        <div class="grid2">
          <button class="big-btn" id="prevBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            Anterior
          </button>
          <button class="big-btn" id="nextBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            Siguiente
          </button>
        </div>

        <div class="card">
          <p class="card-label">Iniciar en...</p>
          <div class="segmented">
            <button id="modePptBtn" class="active">PowerPoint</button>
            <button id="modeBrowserBtn">Navegador</button>
          </div>
        </div>

        <div class="grid2">
          <button class="btn" id="startBtn">Iniciar</button>
          <button class="btn subtle" id="exitBtn">Salir</button>
        </div>

        <div class="grid2">
          <button class="btn subtle" id="blackBtn">Pantalla negra</button>
          <button class="btn subtle" id="whiteBtn">Pantalla blanca</button>
        </div>

        <button class="btn wide" id="playPauseBtn">Play / Pause</button>

        <div class="card">
          <p class="card-label">Ir a diapositiva</p>
          <div class="goto-row">
            <input type="number" id="gotoInput" inputmode="numeric" min="1" max="9999" placeholder="Numero">
            <button class="btn" id="gotoBtn">Ir</button>
          </div>
        </div>
      </section>

      <section class="panel" id="panelLaser" hidden>
        <div class="touch-pad" id="laserPad">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>
          Desliza el dedo aqui para mover el puntero laser
        </div>
      </section>

      <section class="panel" id="panelTeclado" hidden>
        <div class="touch-pad" id="mousePad">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="3" width="12" height="18" rx="6"/><line x1="12" y1="3" x2="12" y2="9"/></svg>
          Desliza para mover el cursor - toque = clic izq - dos dedos = clic der
        </div>

        <input type="text" id="kbInput" class="kb-input" placeholder="Toca aqui y escribe..."
          autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">

        <div class="grid4">
          <button class="btn" id="kbTab">Tab</button>
          <button class="btn" id="kbEsc">Esc</button>
          <button class="btn" id="kbUp">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
          <button class="btn" id="kbBackspace">Borrar</button>
          <button class="btn" id="kbLeft">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          </button>
          <button class="btn" id="kbDown">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
          </button>
          <button class="btn" id="kbRight">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
          <button class="btn" id="kbEnter">Intro</button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-btn active" id="navMando">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M9 10l4 2.5-4 2.5z" fill="currentColor" stroke="none"/></svg>
        Mando
      </button>
      <button class="nav-btn" id="navLaser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="8"/></svg>
        Laser
      </button>
      <button class="nav-btn" id="navTeclado">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h12"/></svg>
        Teclado
      </button>
    </nav>

    <p id="log"></p>
  </div>

<script>
(function () {
  const SERVICE_UUID = "bc6a428d-134f-48d0-b097-5ee6c4a89ba9";
  const CHAR_UUID = "1c2d9c03-ae5b-4dad-b9c9-8236b88b5f70";

  const NEXT = 0x01, PREV = 0x02, START_PPT = 0x03, START_BROWSER = 0x13;
  const EXIT = 0x04, BLACK = 0x05, WHITE = 0x06, PLAYPAUSE = 0x14;
  const GOTO_SLIDE = 0x07;
  const LASER_MOVE = 0x10, LASER_SHOW = 0x11, LASER_HIDE = 0x12;
  const MOUSE_MOVE = 0x20, MOUSE_LEFT = 0x21, MOUSE_RIGHT = 0x22;
  const TYPE_CHAR = 0x30, BACKSPACE = 0x31, ENTER = 0x32, TAB = 0x33;
  const ARROW_UP = 0x38, ARROW_DOWN = 0x39;

  const dot = document.getElementById("dot");
  const statusText = document.getElementById("statusText");
  const connectBtn = document.getElementById("connectBtn");
  const content = document.getElementById("content");
  const bottomNav = document.getElementById("bottomNav");
  const log = document.getElementById("log");

  const panels = {
    mando: document.getElementById("panelMando"),
    laser: document.getElementById("panelLaser"),
    teclado: document.getElementById("panelTeclado"),
  };
  const navBtns = {
    mando: document.getElementById("navMando"),
    laser: document.getElementById("navLaser"),
    teclado: document.getElementById("navTeclado"),
  };

  let characteristic = null;
  let device = null;
  let reconnecting = false;

  function setStatus(state, text) {
    dot.className = "dot" + (state ? " " + state : "");
    statusText.textContent = text;
  }
  function setLog(text) { log.textContent = text; }

  if (!navigator.bluetooth) {
    document.body.innerHTML =
      '<div class="unsupported">Este navegador no soporta Web Bluetooth.<br><br>' +
      "Abre esta pagina con <b>Google Chrome en Android</b> " +
      "(Safari / iPhone no es compatible).</div>";
    return;
  }

  function markConnected() {
    setStatus("connected", "Conectado a " + (device.name || "PC"));
    connectBtn.classList.add("hidden");
    content.classList.add("enabled");
    bottomNav.classList.add("enabled");
    setLog("");
  }

  function markFullyDisconnected(message) {
    characteristic = null;
    setStatus("", "Desconectado");
    connectBtn.classList.remove("hidden");
    content.classList.remove("enabled");
    bottomNav.classList.remove("enabled");
    setLog(message);
  }

  function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

  async function connect() {
    try {
      setStatus("connecting", "Buscando PC...");
      device = await navigator.bluetooth.requestDevice({
        filters: [{ services: [SERVICE_UUID] }],
      });
      device.addEventListener("gattserverdisconnected", onDisconnected);

      setStatus("connecting", "Conectando...");
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      characteristic = await service.getCharacteristic(CHAR_UUID);
      markConnected();
    } catch (err) {
      setStatus("", "Desconectado");
      setLog(err.message || String(err));
    }
  }

  // Los cortes de BLE son habituales (pantalla bloqueada, fuera de alcance...).
  // En vez de obligar a pulsar Conectar cada vez, se reintenta solo unas
  // cuantas veces antes de rendirse y pedir accion manual.
  async function onDisconnected() {
    characteristic = null;
    if (reconnecting || !device) return;
    reconnecting = true;

    const MAX_ATTEMPTS = 6;
    for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
      setStatus("connecting", `Reconectando (${attempt}/${MAX_ATTEMPTS})...`);
      try {
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        characteristic = await service.getCharacteristic(CHAR_UUID);
        markConnected();
        reconnecting = false;
        return;
      } catch (err) {
        await sleep(1500 * attempt);
      }
    }

    reconnecting = false;
    markFullyDisconnected("Se perdio la conexion. Pulsa Conectar de nuevo.");
  }

  async function send(bytes) {
    if (!characteristic) return;
    try {
      await characteristic.writeValueWithoutResponse(bytes);
    } catch (err) {
      try {
        await characteristic.writeValue(bytes);
      } catch (err2) {
        setLog("Error al enviar: " + (err2.message || err2));
      }
    }
  }
  function sendByte(code) { send(new Uint8Array([code])); }

  connectBtn.addEventListener("click", connect);

  // ---- Pestañas ----
  function showTab(name) {
    for (const key in panels) {
      panels[key].hidden = key !== name;
      navBtns[key].classList.toggle("active", key === name);
    }
    if (name !== "laser") endLaser();
    if (name !== "teclado") kbInput.blur();
  }
  navBtns.mando.addEventListener("click", () => showTab("mando"));
  navBtns.laser.addEventListener("click", () => showTab("laser"));
  navBtns.teclado.addEventListener("click", () => showTab("teclado"));

  // ---- Mando ----
  document.getElementById("prevBtn").addEventListener("click", () => sendByte(PREV));
  document.getElementById("nextBtn").addEventListener("click", () => sendByte(NEXT));
  document.getElementById("exitBtn").addEventListener("click", () => sendByte(EXIT));
  document.getElementById("blackBtn").addEventListener("click", () => sendByte(BLACK));
  document.getElementById("whiteBtn").addEventListener("click", () => sendByte(WHITE));
  document.getElementById("playPauseBtn").addEventListener("click", () => sendByte(PLAYPAUSE));

  let presMode = "ppt";
  try {
    presMode = localStorage.getItem("presMode") || "ppt";
  } catch (e) { /* almacenamiento no disponible, usar valor por defecto */ }

  const modePptBtn = document.getElementById("modePptBtn");
  const modeBrowserBtn = document.getElementById("modeBrowserBtn");
  function updateModeUI() {
    modePptBtn.classList.toggle("active", presMode === "ppt");
    modeBrowserBtn.classList.toggle("active", presMode === "browser");
  }
  function setMode(mode) {
    presMode = mode;
    updateModeUI();
    try { localStorage.setItem("presMode", mode); } catch (e) {}
  }
  modePptBtn.addEventListener("click", () => setMode("ppt"));
  modeBrowserBtn.addEventListener("click", () => setMode("browser"));
  updateModeUI();

  document.getElementById("startBtn").addEventListener("click", () => {
    sendByte(presMode === "ppt" ? START_PPT : START_BROWSER);
  });

  const gotoInput = document.getElementById("gotoInput");
  document.getElementById("gotoBtn").addEventListener("click", () => {
    const n = Math.max(1, Math.min(9999, parseInt(gotoInput.value, 10) || 0));
    if (!n) return;
    send(new Uint8Array([GOTO_SLIDE, (n >> 8) & 0xff, n & 0xff]));
    gotoInput.value = "";
    gotoInput.blur();
  });

  // ---- Laser ----
  const laserPad = document.getElementById("laserPad");
  let lastLaserSend = 0;

  function packNorm(cmd, x, y) {
    const xi = Math.round(x * 65535);
    const yi = Math.round(y * 65535);
    return new Uint8Array([cmd, (xi >> 8) & 0xff, xi & 0xff, (yi >> 8) & 0xff, yi & 0xff]);
  }
  function normFromEvent(el, e) {
    const rect = el.getBoundingClientRect();
    let x = (e.clientX - rect.left) / rect.width;
    let y = (e.clientY - rect.top) / rect.height;
    return [Math.min(1, Math.max(0, x)), Math.min(1, Math.max(0, y))];
  }

  laserPad.addEventListener("pointerdown", (e) => {
    laserPad.setPointerCapture(e.pointerId);
    sendByte(LASER_SHOW);
    const [x, y] = normFromEvent(laserPad, e);
    send(packNorm(LASER_MOVE, x, y));
  });
  laserPad.addEventListener("pointermove", (e) => {
    if (e.buttons === 0) return;
    const now = performance.now();
    if (now - lastLaserSend < 40) return;
    lastLaserSend = now;
    const [x, y] = normFromEvent(laserPad, e);
    send(packNorm(LASER_MOVE, x, y));
  });
  function endLaser() { sendByte(LASER_HIDE); }
  laserPad.addEventListener("pointerup", endLaser);
  laserPad.addEventListener("pointercancel", endLaser);
  laserPad.addEventListener("pointerleave", endLaser);

  // ---- Raton tactil (pestaña Teclado) ----
  const mousePad = document.getElementById("mousePad");
  let gesture = null;
  let pendingDx = 0, pendingDy = 0;
  let lastMouseSend = 0;

  function resetGesture(e) {
    if (e.touches.length === 1) {
      const t = e.touches[0];
      gesture = { type: "single", startX: t.clientX, startY: t.clientY, lastX: t.clientX, lastY: t.clientY, startT: performance.now(), moved: false };
    } else if (e.touches.length === 2) {
      gesture = { type: "two", startT: performance.now(), moved: false };
    } else {
      gesture = null;
    }
  }
  function flushMouseMove(force) {
    const now = performance.now();
    if (!force && now - lastMouseSend < 20) return;
    if (pendingDx === 0 && pendingDy === 0) return;
    lastMouseSend = now;
    const dx = Math.max(-127, Math.min(127, Math.round(pendingDx)));
    const dy = Math.max(-127, Math.min(127, Math.round(pendingDy)));
    pendingDx = 0; pendingDy = 0;
    send(new Uint8Array([MOUSE_MOVE, dx & 0xff, dy & 0xff]));
  }

  mousePad.addEventListener("touchstart", (e) => {
    e.preventDefault();
    resetGesture(e);
  }, { passive: false });

  mousePad.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (!gesture) return;
    if (gesture.type === "single" && e.touches.length === 1) {
      const t = e.touches[0];
      pendingDx += t.clientX - gesture.lastX;
      pendingDy += t.clientY - gesture.lastY;
      gesture.lastX = t.clientX;
      gesture.lastY = t.clientY;
      if (Math.abs(t.clientX - gesture.startX) > 6 || Math.abs(t.clientY - gesture.startY) > 6) {
        gesture.moved = true;
      }
      flushMouseMove(false);
    } else if (gesture.type === "two") {
      gesture.moved = true;
    }
  }, { passive: false });

  mousePad.addEventListener("touchend", (e) => {
    e.preventDefault();
    if (gesture && e.touches.length === 0) {
      flushMouseMove(true);
      const dt = performance.now() - gesture.startT;
      if (gesture.type === "single" && !gesture.moved && dt < 300) {
        sendByte(MOUSE_LEFT);
      } else if (gesture.type === "two" && !gesture.moved && dt < 400) {
        sendByte(MOUSE_RIGHT);
      }
    }
    resetGesture(e);
  }, { passive: false });

  mousePad.addEventListener("touchcancel", () => { gesture = null; });

  // ---- Teclado ----
  const kbInput = document.getElementById("kbInput");
  kbInput.addEventListener("keydown", (e) => {
    if (e.key === "Backspace") { e.preventDefault(); sendByte(BACKSPACE); }
    else if (e.key === "Enter") { e.preventDefault(); sendByte(ENTER); }
  });
  kbInput.addEventListener("input", () => {
    const v = kbInput.value;
    if (v.length > 0) {
      const ch = v.slice(-1);
      const chBytes = new TextEncoder().encode(ch);
      const packet = new Uint8Array(chBytes.length + 1);
      packet[0] = TYPE_CHAR;
      packet.set(chBytes, 1);
      send(packet);
    }
    kbInput.value = "";
  });

  document.getElementById("kbTab").addEventListener("click", () => sendByte(TAB));
  document.getElementById("kbEsc").addEventListener("click", () => sendByte(EXIT));
  document.getElementById("kbUp").addEventListener("click", () => sendByte(ARROW_UP));
  document.getElementById("kbDown").addEventListener("click", () => sendByte(ARROW_DOWN));
  document.getElementById("kbLeft").addEventListener("click", () => sendByte(PREV));
  document.getElementById("kbRight").addEventListener("click", () => sendByte(NEXT));
  document.getElementById("kbBackspace").addEventListener("click", () => sendByte(BACKSPACE));
  document.getElementById("kbEnter").addEventListener("click", () => sendByte(ENTER));
})();
</script>
</body>
</html>
